version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: mongo-ipssi
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ipssi2025
    networks:
      - mongo-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-ipssi
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ipssi2025
      ME_CONFIG_MONGODB_URL: mongodb://admin:ipssi2025@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ipssi2025
    depends_on:
      - mongo
    networks:
      - mongo-network

volumes:
  mongo-data: {}

networks:
  mongo-network: {}
